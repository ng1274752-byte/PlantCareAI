
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Scanner | PlantCare AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#556b2f">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/service-worker.js");
        }
    </script>
</head>

<body>

    <header class="app-header">
        <div class="brand">🌿 PlantCare AI</div>
        <a href="/">← Back to Home</a>
    </header>

    <main class="scanner-page">

        <section class="page-heading">
            <span class="eyebrow">AI PLANT DIAGNOSIS</span>
            <h1>Scan your plant.</h1>
            <p>Capture or upload a tomato leaf to identify possible diseases.</p>
        </section>

        <section class="scanner-card">

            <div class="feature-icon">🌱</div>

            <h2>Leaf Image Analysis</h2>
            <p>Take a clear picture of your plant leaf.</p>

            <div class="upload-area">

                <input type="file"
                       id="cameraInput"
                       accept="image/*"
                       capture="environment"
                       hidden>

                <input type="file"
                       id="leafImage"
                       accept="image/*"
                       hidden>

                <button class="primary-btn"
                        onclick="document.getElementById('cameraInput').click()">
                    📷 Take a Photo
                </button>

                <button class="secondary-btn"
                        onclick="document.getElementById('leafImage').click()">
                    Upload from Gallery
                </button>

            </div>

            <img id="preview"
                 alt="Leaf preview"
                 hidden>

            <button class="primary-btn"
                    onclick="analyzeImage()">
                Analyze Leaf
            </button>

        </section>

        <section id="result" class="result-card" hidden>

            <h2>Analysis Result</h2>

            <h3 id="condition"></h3>

            <p id="suggestion"></p>

        </section>

    </main>

    <nav class="bottom-nav">

        <a href="/" class="nav-item">
            <span>⌂</span>
            Home
        </a>

        <a href="/scan" class="nav-item active">
            <span>◎</span>
            Scan
        </a>

        <a href="/assistant" class="nav-item">
            <span>♧</span>
            Assistant
        </a>

    </nav>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

<script src="/static/language.js"></script>
</body>
</html>
